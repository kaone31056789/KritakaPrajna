name: Release

# The other half of auto-update. electron-updater in the app polls this repo's
# GitHub Releases (package.json → build.publish); this is what puts a release
# there. Without it the updater has nothing to find and always reports
# "you are on the latest release", however many versions ahead the code is.
#
# Trigger: push a tag that matches the version in package.json.
#     npm version 4.0.1 && git push --follow-tags
# Or run it by hand from the Actions tab.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # electron-builder needs this to create the release

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Must match the Node the lock file was written with. The tree already
      # requires >=22.12.0 (@electron/rebuild, node-abi), and a lock produced by
      # npm 11 is not reconcilable by the npm 10 that ships with Node 20 —
      # `npm ci` fails there with a spurious "missing from lock file".
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify
        run: |
          npm run lint:undef
          npx cross-env CI=true react-scripts test --watchAll=false
        env:
          CI: true

      # Fails the release if the tag and package.json disagree — electron-updater
      # compares against package.json's version, so a mismatch ships an update
      # that clients either never see or install in a loop.
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          test "$TAG" = "$PKG"

      - name: Build and publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true

      # electron-builder uploads to a DRAFT release. A draft is invisible on the
      # releases page and, more importantly, electron-updater cannot see it — so
      # a "successful" release that is left drafted ships an update nobody gets.
      - name: Publish the draft
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The update feed is only real if it is fetchable anonymously.
      - name: Verify the update feed
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          url="https://github.com/${{ github.repository }}/releases/latest/download/latest.yml"
          echo "fetching $url"
          curl -fsSL "$url" -o feed.yml
          cat feed.yml
          grep -q "version: ${GITHUB_REF_NAME#v}" feed.yml
